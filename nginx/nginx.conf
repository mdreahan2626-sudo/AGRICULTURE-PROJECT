events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream chat_backend {
        server chat-service1:5001;
        server chat-service2:5001;
    }

    upstream weather_backend {
        server weather-service1:5002;
        server weather-service2:5002;
    }

    upstream disease_backend {
        server disease-service1:5003;
        server disease-service2:5003;
    }

    # Chat Service Load Balancer
    server {
        listen 5001;
        client_max_body_size 50M;

        location / {
            proxy_pass http://chat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Weather Advisor Load Balancer
    server {
        listen 5002;
        client_max_body_size 50M;

        location / {
            proxy_pass http://weather_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Disease Detection Load Balancer
    server {
        listen 5003;
        client_max_body_size 50M;

        location / {
            proxy_pass http://disease_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
